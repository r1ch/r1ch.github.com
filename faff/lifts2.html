<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oh My Faff.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <style>
    html { background: #e9eff5; } html, body { margin: 0; height: 100%; overflow-x: hidden; } body { background: transparent !important; }
    #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
    .ui { max-width: 640px; margin: 0 auto; padding: 16px 16px 40vh; }
    .question-container { background: rgba(255,255,255,.88); backdrop-filter: blur(4px); border-radius: 14px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(20,40,70,.18); }
    .result-alert { border-radius: 14px; }
    .history { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .history-item { background: rgba(255,255,255,.88); border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 4px 10px; font-size: .85rem; cursor: pointer; text-align: center; box-shadow: 0 2px 4px rgba(0,0,0,.06); }
    .history-label { display: block; font-size: .7em; opacity: .7; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div class="ui"><div id="history" class="history"></div><div id="card"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="questions.js"></script>
  <script src="map2.js"></script>
</body>
</html>
